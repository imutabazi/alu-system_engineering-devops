<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Ceci n'est pas une page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 540px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #38bdf8;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #cbd5e1; margin-bottom: 1.5rem; line-height: 1.6; }
    a {
      display: inline-block;
      text-decoration: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Ceci n'est pas une page</h1>
    <p>The page you are looking for does not exist or has been moved to another address.</p>
    <a href="/">Go Back Home</a>
  </div>
</body>
</html>
